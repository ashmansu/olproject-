<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Shipment - FreshTrack AI</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="side-logo">
        🌿 FreshTrack AI
    </div>

    <nav>

        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="shipments.html">🚚 Shipments</a>
        <a href="monitoring.html">📡 Monitoring</a>
        <a href="freshness.html">🧠 AI Freshness</a>
        <a href="alerts.html">⚠️ Alerts</a>

        <a href="track.html" class="active">
            📍 Track Shipment
        </a>

        <a href="index.html">
            ↩ Logout
        </a>

    </nav>

</aside>


<main class="dashboard">

    <div class="track-container">

        <h1>Track Shipment</h1>

        <p>
            Enter a shipment ID to view its status.
        </p>


        <div class="track-search">

            <input
                type="text"
                id="trackingId"
                placeholder="e.g. FT-1024"
            >

            <button
                onclick="trackShipment()"
                class="btn">
                Track
            </button>

        </div>


        <div id="result">

            <div class="map">
                📍
            </div>

            <p>
                Enter a shipment ID to view details.
            </p>

        </div>

    </div>

</main>

</div>

<script src="js/app.js"></script>

</body>
</html>
