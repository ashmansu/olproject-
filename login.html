<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FreshTrack AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

<div class="login-box">

    <a href="index.html" class="logo center">
        🌿 FreshTrack AI
    </a>

    <h1>Login</h1>

    <p>Choose your role to continue</p>


    <input
        type="email"
        id="email"
        placeholder="Email address"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <div class="roles">

        <div
            class="role selected"
            data-role="admin"
            data-page="dashboard.html"
        >
            👤
            <br>
            <strong>Admin</strong>
        </div>


        <div
            class="role"
            data-role="transporter"
            data-page="transporter.html"
        >
            🚚
            <br>
            <strong>Transporter</strong>
        </div>


        <div
            class="role"
            data-role="customer"
            data-page="customer.html"
        >
            📦
            <br>
            <strong>Customer</strong>
        </div>

    </div>


    <button
        id="loginButton"
        class="btn full"
        type="button"
    >
        Login as Admin
    </button>


    <small>
        Demo UI — any details can be used.
    </small>

</div>


<script src="js/app.js"></script>

</body>
</html>
